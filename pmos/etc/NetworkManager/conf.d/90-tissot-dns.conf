# postmarketOS's default is dns=dnsmasq, which parks a dnsmasq on
# 127.0.0.1:53 - the address the Pi-hole in the NixOS guest wants, in the
# same network namespace. NetworkManager leaves DNS alone; /etc/resolv.conf
# is a static file pointing at the Pi-hole (the router as fallback).
[main]
dns=none
