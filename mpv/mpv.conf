# Linked to ~/.config/mpv by nix/modules/user/media. Anything under scripts/
# loads on start, its settings live in script-opts/. Runtime state (resume
# positions, the last clip name) goes to ~/.local/state/mpv, so this
# directory stays git-clean.

# --- video ---
vo=gpu-next
profile=high-quality
hwdec=auto-safe
video-sync=display-resample
# Frame interpolation smooths 24fps on 60/144Hz panels but keeps the GPU
# busy; flip on per host if it is worth the heat.
#interpolation=yes
#tscale=oversample

# --- audio ---
volume=100
volume-max=150
audio-file-auto=fuzzy
audio-pitch-correction=yes

# --- subtitles ---
sub-auto=fuzzy
slang=en,uk
sub-font-size=44
sub-border-size=2.5

# --- playback ---
keep-open=yes
save-position-on-quit=yes
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB

# --- ui ---
osd-font=Iosevka Nerd Font
osd-font-size=28
osd-duration=1500
cursor-autohide=1000
autofit-larger=90%x90%

# --- screenshots ---
screenshot-format=png
screenshot-dir=~/Pictures/mpv
screenshot-template="%F-%P"

# --- streams ---
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
