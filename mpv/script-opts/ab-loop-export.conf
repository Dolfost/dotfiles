# Settings for scripts/ab-loop-export.lua (the defaults are shown).
# Output directory. Empty = next to the source file, ~/Videos for streams.
#dir=
# Container extension and encoders. crf/preset are libx264/x265 knobs.
#ext=mp4
#vcodec=libx264
#acodec=aac
#crf=18
#preset=medium
#audio_bitrate=192k
# Forced output pixel format; empty keeps the source's (10-bit h264 plays
# badly in browsers and on phones, hence the default).
#pix_fmt=yuv420p
# Extra ffmpeg output arguments, whitespace-separated.
#extra_args=
# Where the last used name is remembered between runs.
#state_file=~~state/ab-loop-export.name
