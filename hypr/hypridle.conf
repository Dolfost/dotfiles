general {
	lock_cmd = pidof hyprlock || hyprlock      # prevent multiple instances
	before_sleep_cmd = loginctl lock-session   # lock before any suspend
	after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({mode='on'})" # optional: turn screen back on after resume
}

listener {
	timeout = 600
	on-timeout = loginctl lock-session
}

# Screen off after 20s on the lockscreen. hypridle fires each listener only
# once per idle stretch, so this takes two listeners:
#  - 20s covers locks that start a fresh idle counter (boot autolock, manual
#    lock - the keypress itself resets idle)
#  - 620s covers the auto-lock above, firing 20s after it during the same
#    uninterrupted idle stretch
listener {
	timeout = 20
	on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='off'})"
	on-resume  = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='on'})"
	ignore_wayland_inhibit = true
	ignore_dbus_inhibit = true
}

listener {
	timeout = 620
	on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='off'})"
	on-resume  = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='on'})"
	ignore_wayland_inhibit = true
	ignore_dbus_inhibit = true
}
