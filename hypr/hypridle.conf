general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session # lock before any suspend
	after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({action='enable'})" # to avoid having to press a key twice to turn on the display.
}

listener {
	timeout = 600
	on-timeout = loginctl lock-session
}

listener {
	timeout = 60
	on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({action='disable'})"
	on-resume  = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({action='enable'})"
}

# Idle sleep, battery only: on the charger the machine sleeps only when told
# (power key, see nix/modules/system/laptop). A desktop has no AC* supply, so
# the test fails there and nothing happens.
listener {
	timeout = 1800
	on-timeout = grep -qs 0 /sys/class/power_supply/AC*/online && systemctl suspend-then-hibernate
}
