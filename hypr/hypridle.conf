general {
	# pidof: prevent multiple instances. systemd-run: hyprlock must live outside
	# hypridle's cgroup, or restarting hypridle (manually or via nixos-rebuild)
	# while locked kills the lockscreen and strands the session with a dead lock
	# client (misc:allow_session_lock_restore is the recovery for that state).
	lock_cmd = pidof hyprlock || systemd-run --user --collect -- hyprlock
	before_sleep_cmd = loginctl lock-session   # lock before any suspend
	# after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({mode='on'})" # optional: turn screen back on after resume
}

listener {
	timeout = 600
	on-timeout = loginctl lock-session
}

# Screen off while on the lockscreen. hypridle fires each listener only once
# per idle stretch, so this takes two listeners:
#  - 60s covers locks that start a fresh idle counter (boot autolock, manual
#    lock - the keypress itself resets idle) and every wake-while-locked
#    cycle. The monitor needs ~15s to resync after dpms-on, so this must
#    stay well above that or the screen re-blanks right as the picture
#    appears and the password can't be typed.
#  - 620s covers the auto-lock above, firing 20s after it during the same
#    uninterrupted idle stretch (monitor is already awake there)
listener {
	timeout = 60
	on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='off'})"
	on-resume  = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='on'})"
	# ignore_wayland_inhibit = true
	# ignore_dbus_inhibit = true
}

listener {
	timeout = 620
	on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='off'})"
	on-resume  = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({mode='on'})"
	# ignore_wayland_inhibit = true
	# ignore_dbus_inhibit = true
}
